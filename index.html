<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Surprise for Marielena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- professional confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bg:#071026;
    --card:#0f1724;
    --muted:#9aa6bd;
    --accent:#ffd6e0;
    --accent-2:#7dd3fc;
    --glass: rgba(255,255,255,0.03);
    --radius:14px;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#040615);color:var(--accent);-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}

  .card{
    width:100%;max-width:920px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));border-radius:var(--radius);padding:22px;box-shadow:0 18px 60px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03);
  }

  header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#041226;font-weight:700}
  h1{font-size:18px;margin:0;color:#ffe6f0}
  p.lead{margin:4px 0 0 0;color:var(--muted);font-size:13px}

  .controls{display:flex;gap:12px;align-items:center;margin-top:6px}
  select,button{
    background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:var(--accent);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer
  }
  button.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#041226}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}

  /* popup hint */
  .popup{position:fixed;top:20px;right:20px;background:var(--card);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 10px 30px rgba(2,6,23,0.6);font-size:13px;color:var(--muted);z-index:12;display:flex;gap:8px;align-items:center}

  /* message panel */
  .panel{margin-top:18px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.004));padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:10px}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .meta .stamp{color:var(--muted);font-size:13px}
  .quote{background:rgba(255,255,255,0.01);padding:14px;border-radius:10px;color:#eaf6ff;min-height:84px;font-size:16px;line-height:1.45;white-space:pre-wrap}

  .panel-actions{display:flex;gap:10px;align-items:center}
  .pill{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
  .pill.copy{background:#3b82f6;color:#041226}
  .pill.share{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
  .pill.edit{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}

  /* small footer */
  footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}

  /* responsive */
  @media (max-width:640px){
    .card{padding:16px}
    .logo{width:42px;height:42px}
    .quote{font-size:15px}
    .controls{flex-direction:column;align-items:stretch}
  }

  /* fade transitions */
  .fade{transition:opacity 260ms ease,transform 260ms ease}
  .hidden{opacity:0;transform:translateY(6px);pointer-events:none}
  .show{opacity:1;transform:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div class="logo">M</div>
        <div>
          <h1>Surprise for Marielena</h1>
          <p class="lead">A little thought, generated each time you reveal. Crafted with care.</p>
        </div>
      </header>

      <div class="controls">
        <label for="templateSelect" style="color:var(--muted);font-weight:600">Template</label>
        <select id="templateSelect" aria-label="Choose template">
          <option value="sweet">Short & Sweet</option>
          <option value="playful">Playful</option>
          <option value="poetic">Poetic</option>
          <option value="heartfelt">Heartfelt</option>
          <option value="funny">Funny</option>
        </select>

        <button id="revealBtn" class="primary">Reveal</button>
        <button id="randomBtn" class="ghost" title="Reveal a different message">Surprise me</button>

        <div style="flex:1"></div>
      </div>

      <div id="panel" class="panel fade hidden" aria-live="polite">
        <div class="meta">
          <div class="stamp">Recipient: Marielena</div>
          <div id="timeStamp" class="stamp"></div>
        </div>
        <div id="quote" class="quote"></div>
        <div class="panel-actions">
          <button id="copyBtn" class="pill copy">Copy</button>
          <button id="shareBtn" class="pill share">Share</button>
          <button id="regenBtn" class="pill edit">New (no repeat)</button>
        </div>
      </div>

      <footer>
        Generated with a little thought — each reveal shows a different line until the set is exhausted.
      </footer>
    </div>
  </div>

<script>
// Main script: expanded pools (20+ each) + confetti (canvas-confetti) + TTS
(function(){
  const recipientName = 'Marielena';
  const templateSelect = document.getElementById('templateSelect');
  const revealBtn = document.getElementById('revealBtn');
  const randomBtn = document.getElementById('randomBtn');
  const panel = document.getElementById('panel');
  const quoteEl = document.getElementById('quote');
  const timeStamp = document.getElementById('timeStamp');
  const copyBtn = document.getElementById('copyBtn');
  const shareBtn = document.getElementById('shareBtn');
  const regenBtn = document.getElementById('regenBtn');

  // Determine mobile heuristics
  function isMobileView(){
    return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 480;
  }

  // Confetti presets
  const confettiPresets = {
    desktop: {
      colors: ['#ffd6e0','#7dd3fc','#fff1f7'],
      bursts: [
        { particleCount: 80, spread: 70, startVelocity: 40, scalar: 1 },
        { particleCount: 50, spread: 110, startVelocity: 30, scalar: 1 }
      ]
    },
    mobile: {
      // warmer, softer, and a couple of bolder accents for small screens; smaller particle sizes
      colors: ['#ffd6e0','#ffb3d6','#ff9ac1','#7dd3fc','#ffd89e'],
      bursts: [
        { particleCount: 40, spread: 60, startVelocity: 28, gravity: 0.6, scalar: 0.8, drift: 0.2 },
        { particleCount: 30, spread: 90, startVelocity: 18, gravity: 0.7, scalar: 0.7, drift: -0.2 },
        // gentle stream to simulate falling confetti on mobile
        { particleCount: 60, spread: 140, startVelocity: 10, gravity: 0.9, scalar: 0.55 }
      ]
    }
  };

  // Fire confetti using a preset; uses canvas-confetti available as confetti()
  function fireConfettiPreset(preset) {
    if (typeof confetti !== 'function') return;
    const duration = 800; // overall window for bursts
    const now = Date.now();
    preset.bursts.forEach((b, i) => {
      // stagger bursts slightly
      setTimeout(() => {
        confetti({
          particleCount: b.particleCount,
          spread: b.spread,
          startVelocity: b.startVelocity || 30,
          colors: preset.colors,
          origin: { x: Math.random() * 0.6 + 0.2, y: Math.random() * 0.4 + 0.1 },
          gravity: b.gravity || 0.5,
          scalar: b.scalar || 1,
          drift: b.drift || (Math.random() * 0.6 - 0.3)
        });
      }, i * 120);
    });
  }

  // Expanded pools (20+ thoughtful lines each)
  const pool = {
    sweet: [
      `Hey ${recipientName} ❤️\n\nYou make ordinary moments feel extraordinary.`,
      `Dear ${recipientName},\n\nA quick message: you are my favorite today and every day.`,
      `For ${recipientName}: just a little note — your light makes everything better.`,
      `Marielena — your smile is a soft sunrise in a busy world.`,
      `To ${recipientName}: I noticed you today, and I smiled because of you.`,
      `A little thought for ${recipientName}: thank you for turning small moments into memories.`,
      `${recipientName}, you make my day kinder without even trying.`,
      `Short and true: I appreciate you, ${recipientName}.`,
      `You are quietly brilliant, ${recipientName} — and I see it.`,
      `A warm hello to ${recipientName} — you are cherished.`,
      `${recipientName}, you bring color to my plainest hours.`,
      `Tiny reminder, ${recipientName}: you are loved today.`,
      `For ${recipientName}: your presence is my favorite comfort.`,
      `${recipientName}, thank you for being steady and kind.`,
      `Simple truth: life is better with you, ${recipientName}.`,
      `A gentle note — you make the little things feel important, ${recipientName}.`,
      `${recipientName}, you are the calm in my storm.`,
      `Thinking of you, ${recipientName}, and smiling for no reason.`,
      `Because of you, ${recipientName}, ordinary turns into special.`,
      `You are a small miracle to me, ${recipientName}.`
    ],
    playful: [
      `To ${recipientName}, the champion of stolen fries and stolen hearts. 🍟❤️`,
      `${recipientName}! If you were a song, I'd put you on repeat.`,
      `Warning, ${recipientName}: hugging you may cause extreme happiness.`,
      `PS ${recipientName}: You owe me one hug — for scientific purposes.`,
      `Hey ${recipientName}, you make my to-do list feel like a love letter.`,
      `${recipientName}, your laugh should have its own fan club.`,
      `I'd share my fries with you any day, ${recipientName} — that's real love.`,
      `You’re the best kind of distraction, ${recipientName}.`,
      `${recipientName}, your jokes are my favorite soundtrack.`,
      `If smiles were currency, ${recipientName}, I’d be rich because of you.`,
      `You break the 'serious' mode — thank you, ${recipientName}.`,
      `Careful: being near ${recipientName} increases happiness levels.`,
      `${recipientName}, never stop being delightfully you.`,
      `I nominate ${recipientName} for CEO of Cheerfulness.`,
      `You make the simplest things ridiculously fun, ${recipientName}.`,
      `Note: ${recipientName} is a certified laugh supplier.`,
      `Just so you know, ${recipientName}, you make silly look beautiful.`,
      `${recipientName}, I'm keeping you for moral support and snacks.`,
      `If life were a game, ${recipientName}, you'd be the best power-up.`,
      `Plot twist: ${recipientName} is the main character of my favorite story.`
    ],
    poetic: [
      `${recipientName}, you are my favorite hello and my calmest harbor.`,
      `Like moonlight through the trees — that's the way you arrive, ${recipientName}.`,
      `If days were verses, you would be the chorus I never tire of, ${recipientName}.`,
      `Your laughter is the line I read when I want the world to pause, ${recipientName}.`,
      `For ${recipientName}: a quiet poem — your presence is the punctuation of my best sentences.`,
      `You are the hush after a long day, ${recipientName}.`,
      `${recipientName}, you are the soft footstep that makes home feel like a place.`,
      `When I close my eyes, I find you in the gentlest lines, ${recipientName}.`,
      `You are the unexpected rhyme in my favorite poem, ${recipientName}.`,
      `Your voice is the map back to everything that matters, ${recipientName}.`,
      `Like a steady lighthouse, ${recipientName}, you guide me warmly.`,
      `${recipientName}, you turn ordinary light into gold.`,
      `The world feels a little more splendid because of you, ${recipientName}.`,
      `Your quiet is loud in the best way, ${recipientName}.`,
      `Tenderly: ${recipientName}, you are my calm favorite.`,
      `You fit into my sentences like a beloved adjective, ${recipientName}.`,
      `If I could write a sky, it would be your name, ${recipientName}.`,
      `Each laugh from you is a soft meteor across my evening, ${recipientName}.`,
      `You are the gentle tension that lets songs begin, ${recipientName}.`,
      `If I kept one secret, ${recipientName}, it would be how much I treasure you.`
    ],
    heartfelt: [
      `Hey ${recipientName},\\n\\nI'm grateful for your kindness and how you make home feel like a person.`,
      `${recipientName}, thank you for staying — for the small things and the enormous ones.`,
      `I don't say it enough: you make me better by simply being you, ${recipientName}.`,
      `Because of you, ordinary moments become memories. Thank you, ${recipientName}.`,
      `To ${recipientName}: your patience, your laugh, your light—I'm so grateful.`,
      `${recipientName}, your support is the quiet strength of my days.`,
      `I carry your kindness with me, ${recipientName}, like a warm cardigan.`,
      `For all the times you listen: thank you, ${recipientName}.`,
      `You make hard things softer, ${recipientName}.`,
      `I am endlessly thankful for you, ${recipientName}.`,
      `Your empathy is a gift I never expected, ${recipientName}.`,
      `${recipientName}, you are the reason I believe in good mornings.`,
      `I notice the ways you say 'I care' without saying it, ${recipientName}.`,
      `With you, the world feels more possible, ${recipientName}.`,
      `I am grateful for your steady presence, ${recipientName}.`,
      `Thank you for being my quiet champion, ${recipientName}.`,
      `You are the anchor that softens my storms, ${recipientName}.`,
      `Because of you, simple days feel like blessings, ${recipientName}.`,
      `Every day with you adds a gentle best line to my life, ${recipientName}.`,
      `If gratitude had a voice, it would say your name—${recipientName}.`
    ],
    funny: [
      `If loving you were a contest, ${recipientName}, I'd definitely be overqualified. 😂`,
      `They say laughter is the best medicine — with you, I'm cured every day, ${recipientName}.`,
      `${recipientName}, you're the reason my phone has too many photos and not enough storage.`,
      `I'd brave the worst pun festival for you, ${recipientName}. That's real love.`,
      `You + me + pizza = true happiness. Also, ${recipientName}, you steal the blanket.`,
      `${recipientName}, you're the official supplier of my good moods.`,
      `If I had to choose between dessert or you, I'd choose dessert — said no one about ${recipientName}.`,
      `You make my bad jokes feel like classics, ${recipientName}.`,
      `Caution: hugging ${recipientName} may result in sudden grinning.`,
      `I admire your talent for making ordinary things hilariously memorable, ${recipientName}.`,
      `Would fight a dragon for you, ${recipientName}. Would also ask it to return my socks.`,
      `${recipientName}, your laugh is my favorite notification sound.`,
      `You make every plan secretly better, ${recipientName}.`,
      `I tried to be serious once. It lasted 3 minutes near ${recipientName}.`,
      `Official record: ${recipientName} wins the award for best smile.`,
      `We should form a club: Fans of ${recipientName}. Membership perks: smiles.`,
      `If charm had a recipe, ${recipientName} would be the secret spice.`,
      `You're my favorite plot twist, ${recipientName}.`,
      `Public service announcement: ${recipientName} causes excessive joy.`,
      `Pro tip: spending time with ${recipientName} improves everything.`
    ]
  };

  // localStorage key prefix to persist which indices used per template
  const USED_KEY = 'marielena_used_indices_v1';
  function loadUsed() {
    try { return JSON.parse(localStorage.getItem(USED_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveUsed(obj) { localStorage.setItem(USED_KEY, JSON.stringify(obj)); }

  // get a non-repeating index for template; resets when exhausted
  function pickIndex(template){
    const arr = pool[template] || pool.heartfelt;
    const used = loadUsed();
    used[template] = used[template] || [];
    const usedSet = new Set(used[template]);
    if (usedSet.size >= arr.length) {
      // reset
      used[template] = [];
      saveUsed(used);
      usedSet.clear();
    }
    // available indices
    const avail = arr.map((_,i)=>i).filter(i => !usedSet.has(i));
    const idx = avail[Math.floor(Math.random()*avail.length)];
    used[template].push(idx);
    saveUsed(used);
    return idx;
  }

  function formatNow(){
    const d = new Date();
    return d.toLocaleString();
  }

  function playTTS(text){
    try{
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 1.05;
        utter.pitch = 1.05;
        // prefer a female voice if available
        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length) {
          const preferred = voices.find(v => /female|woman|susan|sara|samantha|victoria|alloy/i.test(v.name.toLowerCase()));
          if (preferred) utter.voice = preferred;
        }
        // small delay to ensure voices are loaded in some browsers
        setTimeout(()=>{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter); }, 100);
      }
    }catch(e){ /* ignore TTS errors */ }
  }

  function showQuote(template, index){
    const text = pool[template][index];
    quoteEl.textContent = text;
    timeStamp.textContent = `Thought generated • ${formatNow()}`;
    panel.classList.remove('hidden');
    panel.classList.add('show');

    // Choose confetti behavior based on mobile heuristics
    try{
      if (isMobileView()) {
        fireConfettiPreset(confettiPresets.mobile);
      } else {
        fireConfettiPreset(confettiPresets.desktop);
      }
    }catch(e){ /* confetti lib not available */ }

    // play short TTS: "I love you"
    playTTS('I love you');
  }

  function reveal(template){
    const t = template || templateSelect.value || 'heartfelt';
    const idx = pickIndex(t);
    showQuote(t, idx);
  }

  // wire buttons
  revealBtn.addEventListener('click', ()=>{ reveal(); });
  randomBtn.addEventListener('click', ()=>{ const keys = Object.keys(pool); const rand = keys[Math.floor(Math.random()*keys.length)]; reveal(rand); });
  regenBtn.addEventListener('click', ()=>{ reveal(templateSelect.value); });

  copyBtn.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(quoteEl.textContent || ''); copyBtn.textContent='Copied ✓'; setTimeout(()=>copyBtn.textContent='Copy',1400);}catch(e){ alert('Copy failed — select the text and copy manually.'); }
  });

  shareBtn.addEventListener('click', async ()=>{
    const text = (quoteEl.textContent || '') + '\n\n— ' + recipientName;
    if (navigator.share) {
      try{ await navigator.share({ title: 'A little thought for Marielena', text }); }
      catch(_){ }
    } else {
      try{ await navigator.clipboard.writeText(text); alert('Share not available — message copied to clipboard.'); }catch(e){ alert('Share/copy not available.'); }
    }
  });

  // auto-reveal one on load for convenience (but will not repeat due to storage)
  setTimeout(()=>{ reveal(templateSelect.value); }, 500);

  // expose quick debug to window
  window._marielena = {reveal, pool};
})();
</script>
</body>
</html>
