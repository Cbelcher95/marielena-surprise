<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Surprise for Marielena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071026;
    --card:#0f1724;
    --muted:#9aa6bd;
    --accent:#ffd6e0;
    --accent-2:#7dd3fc;
    --glass: rgba(255,255,255,0.03);
    --radius:14px;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#040615);color:var(--accent);-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}

  .card{
    width:100%;max-width:920px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));border-radius:var(--radius);padding:22px;box-shadow:0 18px 60px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03);
  }

  header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#041226;font-weight:700}
  h1{font-size:18px;margin:0;color:#ffe6f0}
  p.lead{margin:4px 0 0 0;color:var(--muted);font-size:13px}

  .controls{display:flex;gap:12px;align-items:center;margin-top:6px}
  select,button{
    background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:var(--accent);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer
  }
  button.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#041226}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}

  /* popup hint */
  .popup{position:fixed;top:20px;right:20px;background:var(--card);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 10px 30px rgba(2,6,23,0.6);font-size:13px;color:var(--muted);z-index:12;display:flex;gap:8px;align-items:center}

  /* message panel */
  .panel{margin-top:18px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.004));padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:10px}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .meta .stamp{color:var(--muted);font-size:13px}
  .quote{background:rgba(255,255,255,0.01);padding:14px;border-radius:10px;color:#eaf6ff;min-height:84px;font-size:16px;line-height:1.45;white-space:pre-wrap}

  .panel-actions{display:flex;gap:10px;align-items:center}
  .pill{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
  .pill.copy{background:#3b82f6;color:#041226}
  .pill.share{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
  .pill.edit{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}

  /* small footer */
  footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}

  /* responsive */
  @media (max-width:640px){
    .card{padding:16px}
    .logo{width:42px;height:42px}
    .quote{font-size:15px}
    .controls{flex-direction:column;align-items:stretch}
  }

  /* fade transitions */
  .fade{transition:opacity 260ms ease,transform 260ms ease}
  .hidden{opacity:0;transform:translateY(6px);pointer-events:none}
  .show{opacity:1;transform:none}

  /* gentle confetti (emoji burst) */
  .burst{position:absolute;pointer-events:none;opacity:0;animation:burst 900ms ease-out forwards}
  @keyframes burst{0%{opacity:1;transform:translateY(-6px) scale(0.8)}60%{transform:translateY(-28px) scale(1.08)}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div class="logo">M</div>
        <div>
          <h1>Surprise for Marielena</h1>
          <p class="lead">A little thought, generated each time you reveal. Crafted with care.</p>
        </div>
      </header>

      <div class="controls">
        <label for="templateSelect" style="color:var(--muted);font-weight:600">Template</label>
        <select id="templateSelect" aria-label="Choose template">
          <option value="sweet">Short & Sweet</option>
          <option value="playful">Playful</option>
          <option value="poetic">Poetic</option>
          <option value="heartfelt">Heartfelt</option>
          <option value="funny">Funny</option>
        </select>

        <button id="revealBtn" class="primary">Reveal</button>
        <button id="randomBtn" class="ghost" title="Reveal a different message">Surprise me</button>

        <div style="flex:1"></div>
        <button id="editBtn" class="ghost">Edit template (view)</button>
      </div>

      <div id="panel" class="panel fade hidden" aria-live="polite">
        <div class="meta">
          <div class="stamp">Recipient: Marielena</div>
          <div id="timeStamp" class="stamp"></div>
        </div>
        <div id="quote" class="quote"></div>
        <div class="panel-actions">
          <button id="copyBtn" class="pill copy">Copy</button>
          <button id="shareBtn" class="pill share">Share</button>
          <button id="regenBtn" class="pill edit">New (no repeat)</button>
        </div>
      </div>

      <footer>
        Generated with a little thought — each reveal shows a different line until the set is exhausted.
      </footer>
    </div>
  </div>

  <div id="burstRoot"></div>

<script>
// Main script: professional polish + no-repeat generator
(function(){
  const recipientName = 'Marielena';
  const templateSelect = document.getElementById('templateSelect');
  const revealBtn = document.getElementById('revealBtn');
  const randomBtn = document.getElementById('randomBtn');
  const panel = document.getElementById('panel');
  const quoteEl = document.getElementById('quote');
  const timeStamp = document.getElementById('timeStamp');
  const copyBtn = document.getElementById('copyBtn');
  const shareBtn = document.getElementById('shareBtn');
  const regenBtn = document.getElementById('regenBtn');
  const burstRoot = document.getElementById('burstRoot');

  // Pools of thoughtful lines per template — multiple options
  const pool = {
    sweet: [
      `Hey ${recipientName} ❤️\n\nYou make ordinary moments feel extraordinary.`,
      `Dear ${recipientName},\n\nA quick message: you are my favorite today and every day.`,
      `For ${recipientName}: just a little note — your light makes everything better.`,
      `Marielena — your smile is a soft sunrise in a busy world.`,
      `To ${recipientName}: I noticed you today, and I smiled because of you.`
    ],
    playful: [
      `To ${recipientName}, the champion of stolen fries and stolen hearts. 🍟❤️`,
      `${recipientName}! If you were a song, I'd put you on repeat.`,
      `Warning, ${recipientName}: hugging you may cause extreme happiness.`,
      `PS ${recipientName}: You owe me one hug — for scientific purposes.`,
      `Hey ${recipientName}, you make my to-do list feel like a love letter.`
    ],
    poetic: [
      `${recipientName}, you are my favorite hello and my calmest harbor.`,
      `Like moonlight through the trees — that's the way you arrive, ${recipientName}.`,
      `If days were verses, you would be the chorus I never tire of, ${recipientName}.`,
      `Your laughter is the line I read when I want the world to pause, ${recipientName}.`,
      `For ${recipientName}: a quiet poem — your presence is the punctuation of my best sentences.`
    ],
    heartfelt: [
      `Hey ${recipientName},\n\nI'm grateful for your kindness and how you make home feel like a person.`,
      `${recipientName}, thank you for staying — for the small things and the enormous ones.`,
      `I don't say it enough: you make me better by simply being you, ${recipientName}.`,
      `Because of you, ordinary moments become memories. Thank you, ${recipientName}.`,
      `To ${recipientName}: your patience, your laugh, your light—I'm so grateful.`
    ],
    funny: [
      `If loving you were a contest, ${recipientName}, I'd definitely be overqualified. 😂`,
      `They say laughter is the best medicine — with you, I'm cured every day, ${recipientName}.`,
      `${recipientName}, you're the reason my phone has too many photos and not enough storage.`,
      `I'd brave the worst pun festival for you, ${recipientName}. That's real love.`,
      `You + me + pizza = true happiness. Also, ${recipientName}, you steal the blanket.`
    ]
  };

  // localStorage key prefix to persist which indices used per template
  const USED_KEY = 'marielena_used_indices_v1';
  function loadUsed() {
    try { return JSON.parse(localStorage.getItem(USED_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveUsed(obj) { localStorage.setItem(USED_KEY, JSON.stringify(obj)); }

  // get a non-repeating index for template; resets when exhausted
  function pickIndex(template){
    const arr = pool[template] || pool.heartfelt;
    const used = loadUsed();
    used[template] = used[template] || [];
    const usedSet = new Set(used[template]);
    if (usedSet.size >= arr.length) {
      // reset
      used[template] = [];
      saveUsed(used);
      usedSet.clear();
    }
    // available indices
    const avail = arr.map((_,i)=>i).filter(i => !usedSet.has(i));
    const idx = avail[Math.floor(Math.random()*avail.length)];
    used[template].push(idx);
    saveUsed(used);
    return idx;
  }

  function formatNow(){
    const d = new Date();
    return d.toLocaleString();
  }

  function showQuote(template, index){
    const text = pool[template][index];
    quoteEl.textContent = text;
    timeStamp.textContent = `Thought generated • ${formatNow()}`;
    panel.classList.remove('hidden');
    panel.classList.add('show');
    // small burst effect
    spawnBurst();
  }

  // spawn small emoji burst near panel
  function spawnBurst(){
    const emojis = ['✨','💖','🌟','💫','🥰'];
    const el = document.createElement('div');
    el.className = 'burst';
    el.style.left = (20 + Math.random()*60)+'%';
    el.style.top = (40 + Math.random()*30)+'%';
    el.style.fontSize = (18 + Math.random()*22)+'px';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 1000);
  }

  function reveal(template){
    const t = template || templateSelect.value || 'heartfelt';
    const idx = pickIndex(t);
    showQuote(t, idx);
  }

  // wire buttons
  revealBtn.addEventListener('click', ()=>{ reveal(); backdropHidden(); });
  randomBtn.addEventListener('click', ()=>{ const keys = Object.keys(pool); const rand = keys[Math.floor(Math.random()*keys.length)]; reveal(rand); backdropHidden(); });
  regenBtn.addEventListener('click', ()=>{ reveal(templateSelect.value); });

  copyBtn.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(quoteEl.textContent || ''); copyBtn.textContent='Copied ✓'; setTimeout(()=>copyBtn.textContent='Copy',1400);}catch(e){ alert('Copy failed — select the text and copy manually.'); }
  });

  shareBtn.addEventListener('click', async ()=>{
    const text = (quoteEl.textContent || '') + '\n\n— ' + recipientName;
    if (navigator.share) {
      try{ await navigator.share({ title: 'A little thought for Marielena', text }); }
      catch(_){}
    } else {
      try{ await navigator.clipboard.writeText(text); alert('Share not available — message copied to clipboard.'); }catch(e){ alert('Share/copy not available.'); }
    }
  });

  // Hide the modal backdrop (we keep no blocking modal now)
  function backdropHidden(){ /* placeholder if we had modal */ }

  // auto-reveal one on load for convenience (but will not repeat due to storage)
  setTimeout(()=>{ reveal(templateSelect.value); }, 500);

  // expose quick debug to window
  window._marielena = {reveal, pool};
})();
</script>
</body>
</html>
